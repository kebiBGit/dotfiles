term xterm-256color

font_size 11.5

cursor_shape beam

url_style straight

detect_urls yes

copy_on_select a1

map shift+cmd+v paste_from_buffer a1

enable_audio_bell no

window_border_width 2 pt

window_margin_width 2 

single_window_margin_width 2

window_padding_width 0 1 0 0

inactive_border_color #ffffff

confirm_os_window_close 0

background_opacity 0.85

# enable_background_blur yes

background_blur 1 

dynamic_background_opacity yes

dim_opacity 1.0

# BEGIN_KITTY_THEME
# Eldritch dark
include current-theme.conf
# END_KITTY_THEME
close_on_child_death yes

map ctrl+backspace send_text all \x17

cursor_trail 1

# config for tiles

enabled_layouts splits,tall,stack
map ctrl+shift+enter launch --location=vsplit
map ctrl+shift+d launch --location=hsplit
map ctrl+shift+h   neighboring_window left
map ctrl+shift+l  neighboring_window right
map ctrl+shift+k     neighboring_window up
map ctrl+shift+j   neighboring_window down
map ctrl+shift+t new_tab_with_cwd

# tab bar configs
tab_bar_edge top
tab_bar_style powerline
tab_bar_margin_width 8.0
tab_bar_margin_height 4.0 0.0
# font_family JetBrainsMono


# BEGIN_KITTY_FONTS
font_family      family="JetBrains Mono"
# bold_font        auto
# italic_font      auto
# bold_italic_font auto
# END_KITTY_FONTS

symbol_map U+e000-U+e00a,U+e0a0-U+e0a2,U+e0a3,U+e0b0-U+e0b3,U+e0b4-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ea60-U+ec1e,U+ed00-U+efce,U+f000-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono

# symbol_map U+E000-U+F8FF Symbols Nerd Font
